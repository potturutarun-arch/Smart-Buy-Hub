<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - SmartBuyHub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="index.css">
    <style>
        body { background: var(--bg-light); display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .forgot-container { max-width: 500px; width: 90%; background: white; border-radius: 20px; box-shadow: var(--shadow-lg); padding: 3rem; text-align: center; }
        .icon-circle { width: 80px; height: 80px; background: #ecfdf5; color: var(--accent-color); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 2rem; margin: 0 auto 1.5rem auto; }
        .forgot-container h2 { font-size: 1.8rem; margin-bottom: 0.5rem; color: var(--text-main); }
        .forgot-container p { color: var(--text-muted); margin-bottom: 2rem; line-height: 1.5; }
        .input-group { text-align: left; margin-bottom: 1.5rem; }
        .input-group label { display: block; margin-bottom: 0.5rem; font-weight: 500; color: var(--text-main); }
        .input-group input { width: 100%; padding: 0.8rem 1rem; border: 1px solid var(--border-color); border-radius: 8px; font-size: 1rem; outline: none; transition: var(--transition); }
        .input-group input:focus { border-color: var(--primary-color); box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.1); }
        .btn-reset { width: 100%; padding: 1rem; background: var(--primary-color); color: white; border: none; border-radius: 8px; font-size: 1.1rem; font-weight: 600; cursor: pointer; transition: var(--transition); margin-bottom: 1.5rem; }
        .btn-reset:hover { background: var(--primary-hover); transform: translateY(-2px); box-shadow: var(--shadow-md); }
        .back-link { display: inline-block; color: var(--text-muted); text-decoration: none; font-weight: 500; }
        .back-link:hover { color: var(--primary-color); }
        .success-msg { color: var(--accent-color); font-weight: 500; background: #ecfdf5; padding: 1rem; border-radius: 8px; border: 1px dashed var(--accent-color); margin-bottom: 1.5rem; display: none; }
        .error-msg { color: #ef4444; font-weight: 500; background: #fef2f2; padding: 1rem; border-radius: 8px; border: 1px dashed #ef4444; margin-bottom: 1.5rem; display: none; }
    </style>
</head>
<body>
    <div class="forgot-container">
        <div class="icon-circle">
            <i class="fa-solid fa-key"></i>
        </div>
        <h2>Forgot Password?</h2>
        <p>No worries, we'll send you reset instructions. Enter your registered email address below.</p>
        
        <div class="success-msg" id="successMsg">Success! If that email exists in our system, we have sent a password reset link.</div>
        <div class="error-msg" id="errorMsg">Failed to process request. Please try again.</div>

        <form id="forgotForm">
            <div class="input-group">
                <label>Email Address</label>
                <input type="email" id="email" placeholder="test@example.com" required>
            </div>
            <button type="submit" class="btn-reset" id="resetBtn">Reset Password</button>
        </form>
        
        <a href="login.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Back to Login</a>
    </div>

    <script>
        document.getElementById('forgotForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const btn = document.getElementById('resetBtn');
            const successMsg = document.getElementById('successMsg');
            const errorMsg = document.getElementById('errorMsg');

            btn.textContent = 'Sending...';
            btn.disabled = true;
            successMsg.style.display = 'none';
            errorMsg.style.display = 'none';

            try {
                const res = await fetch('http://localhost:3000/api/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });

                // For security, always show success even if email doesn't exist
                successMsg.style.display = 'block';
                document.getElementById('forgotForm').style.display = 'none';
            } catch (err) {
                console.error(err);
                errorMsg.style.display = 'block';
                btn.textContent = 'Reset Password';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
