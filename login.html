<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SmartBuyHub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="index.css">
    <style>
        body { background: var(--bg-light); display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .login-container { display: flex; max-width: 900px; width: 90%; background: white; border-radius: 20px; box-shadow: var(--shadow-lg); overflow: hidden; }
        .login-branding { flex: 1; background: linear-gradient(135deg, var(--primary-color) 0%, var(--accent-color) 100%); color: white; padding: 3rem; display: flex; flex-direction: column; justify-content: center; }
        .login-branding h1 { font-size: 2.5rem; margin-bottom: 1rem; }
        .login-branding p { font-size: 1.1rem; opacity: 0.9; }
        .login-form-area { flex: 1; padding: 3rem; }
        .login-form-area h2 { font-size: 1.8rem; margin-bottom: 1.5rem; color: var(--text-main); }
        .input-group { margin-bottom: 1.5rem; }
        .input-group label { display: block; margin-bottom: 0.5rem; font-weight: 500; color: var(--text-main); }
        .input-group input { width: 100%; padding: 0.8rem 1rem; border: 1px solid var(--border-color); border-radius: 8px; font-size: 1rem; outline: none; transition: var(--transition); }
        .input-group input:focus { border-color: var(--primary-color); box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.1); }
        .btn-login { width: 100%; padding: 1rem; background: var(--primary-color); color: white; border: none; border-radius: 8px; font-size: 1.1rem; font-weight: 600; cursor: pointer; transition: var(--transition); }
        .btn-login:hover { background: var(--primary-hover); transform: translateY(-2px); box-shadow: var(--shadow-md); }
        .error-msg { color: #ef4444; font-size: 0.9rem; margin-bottom: 1rem; display: none; }
        .back-link { display: inline-block; margin-bottom: 2rem; color: var(--text-muted); text-decoration: none; font-weight: 500; }
        .back-link:hover { color: var(--primary-color); }
        @media(max-width: 768px) { .login-container { flex-direction: column; } .login-branding { padding: 2rem; } }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-branding">
            <a href="index.html" style="color: white; text-decoration: none; display: flex; align-items: center; gap: 0.5rem; margin-bottom: 2rem; font-weight: 700; font-size: 1.2rem;">
                <i class="fa-solid fa-bag-shopping"></i> SmartBuyHub
            </a>
            <h1>Earn While You Shop.</h1>
            <p>Sign in to access your profile, view your earnings, and discover exclusive affiliate deals.</p>
        </div>
        <div class="login-form-area">
            <h2>Welcome Back</h2>
            <div class="error-msg" id="errorMsg">Invalid credentials. Try test@example.com / password123</div>
            <form id="loginForm">
                <div class="input-group">
                    <label>Email or Phone Number</label>
                    <input type="text" id="email" placeholder="test@example.com" required>
                </div>
                <div class="input-group">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
                        <label style="margin-bottom: 0;">Password</label>
                        <a href="forgot-password.html" style="font-size: 0.85rem; color: var(--primary-color); text-decoration: none; font-weight: 500;">Forgot Password?</a>
                    </div>
                    <input type="password" id="password" placeholder="password123" required>
                </div>
                <button type="submit" class="btn-login" id="loginBtn">Login to Dashboard</button>
            </form>
            
            <div style="text-align: center; margin-top: 1.5rem; color: var(--text-muted);">
                Don't have an account? <a href="signup.html" style="color: var(--primary-color); text-decoration: none; font-weight: 600;">Sign Up</a>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const btn = document.getElementById('loginBtn');
            const errorMsg = document.getElementById('errorMsg');

            btn.textContent = 'Logging in...';
            btn.disabled = true;

            try {
                const res = await fetch('http://localhost:3000/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();

                if (data.success) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('userId', data.userId);
                    window.location.href = 'profile.html';
                } else {
                    errorMsg.style.display = 'block';
                    btn.textContent = 'Login to Dashboard';
                    btn.disabled = false;
                }
            } catch (err) {
                console.error(err);
                errorMsg.textContent = 'Server error. Is the backend running?';
                errorMsg.style.display = 'block';
                btn.textContent = 'Login to Dashboard';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
